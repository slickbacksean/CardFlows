<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardFlow overlay</title>
    <script src="huds"></script>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div
      class="bubble"
      id="band"
      data-kind="scanner_off"
      aria-label="CardFlow overlay, no card confirmed"
    >
      <div class="row">
        <div class="thumb" id="thumb" aria-label="No catalog art"></div>
        <div class="copy">
          <p class="name" id="name">Scanner off</p>
          <p class="raw-label">Raw</p>
          <p class="raw-value" id="raw"></p>
        </div>
        <div class="slabs">
          <div class="slab">
            <p class="slab-label">PSA 9</p>
            <p class="slab-value" id="psa9"></p>
          </div>
          <div class="slab">
            <p class="slab-label">PSA 10</p>
            <p class="slab-value" id="psa10"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>

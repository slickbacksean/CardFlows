labels:
  - name: "Status: Inbox"
    color: "f29513"
    description: "Raw idea, bug, request, or finding; not ready for work"
  - name: "Status: Needs Refinement"
    color: "fc2929"
    description: "Requirements, dependencies, or acceptance criteria are missing"
  - name: "Status: Blocked"
    color: "b60205"
    description: "Cannot progress due to a dependency, access, decision, API, device, or external answer"
  - name: "Status: Ready"
    color: "0e8a16"
    description: "Fully specified, unblocked, and approved for an agent to start"
  - name: "Status: In Progress"
    color: "1d76db"
    description: "One named agent is actively working it"
  - name: "Status: Needs Review"
    color: "fef2c0"
    description: "Code, research, design, or plan is complete and needs review"
  - name: "Status: QA Testing"
    color: "c5def5"
    description: "Implementation is accepted for functional, device, regression, or security testing"
  - name: "Status: Founder Approval"
    color: "e11d21"
    description: "Requires your explicit decision before merge, spending, release, vendor activation, or policy action"
  - name: "Status: Ready to Merge"
    color: "0052cc"
    description: "PR approved, tests passed, QA signed off, no founder decision remains"
  - name: "Status: Done"
    color: "0075ca"
    description: "Merged/deployed/documented; acceptance criteria met"
  - name: "Status: Won't Do"
    color: "cfd3d7"
    description: "Rejected, obsolete, duplicate, or intentionally deferred"

apply plugin: 'com.android.library'

group = 'expo.modules.cardflowlivevideo'
version = '0.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

def easProfile = (System.getenv("EAS_BUILD_PROFILE") ?: "").toLowerCase()
def yolo26nBlocked = ["production", "store", "app-store", "appstore"].contains(easProfile)
def yolo26nOnDevice = !yolo26nBlocked &&
  (System.getenv("CARD_FLOW_YOLO26N_ONDEVICE") ?: "false").equalsIgnoreCase("true")

android {
  namespace "expo.modules.cardflowlivevideo"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    // Pre-ship only. Production / App Store EAS profiles stay false.
    buildConfigField "boolean", "YOLO26N_ONDEVICE", yolo26nOnDevice.toString()
  }
  lintOptions {
    abortOnError false
  }
}

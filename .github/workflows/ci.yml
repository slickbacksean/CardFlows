name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so one red step doesn't hide the others.
      - name: Test
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Mobile lint
        if: ${{ !cancelled() }}
        run: pnpm --filter @cardflow/mobile lint

      - name: Legacy packages (build, test, typecheck)
        if: ${{ !cancelled() }}
        run: pnpm test:legacy && pnpm typecheck:legacy

  grader-e2e:
    # One real photo grade through the vendored cardgrading library (Python + OpenCV).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/vendor/cardgrading/requirements.txt

      - name: Install grader (opencv-python-headless, pinned)
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --only-binary=:all: -r apps/api/vendor/cardgrading/requirements.txt
          apps/api/.venv/bin/python -c "import cv2, numpy; print('cv2', cv2.__version__, 'numpy', numpy.__version__)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Real end-to-end photo grade
        run: pnpm --filter @cardflow/api test:grade-e2e

  api-image:
    # Build the API container and check that /health sees OpenCV inside it. Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f apps/api/Dockerfile -t cardflow-api:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name cardflow-api -p 8080:8080 --memory=2g --cpus=1 cardflow-api:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health -o health.json \
              && node -e "const h=require('./health.json'); process.exit(h.ok && h.gradeEngine && h.gradeEngine.ok ? 0 : 1)"; then
              ready=1; break
            fi
            sleep 2
          done
          cat health.json || true
          if [ "$ready" != 1 ]; then echo "grader not ready in image"; exit 1; fi

      - name: Container logs
        if: ${{ always() }}
        run: docker logs cardflow-api || true

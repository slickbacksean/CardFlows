name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so one red step doesn't hide the others.
      - name: Test
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Mobile lint
        if: ${{ !cancelled() }}
        run: pnpm --filter @cardflow/mobile lint

      - name: Legacy packages (build, test, typecheck)
        if: ${{ !cancelled() }}
        run: pnpm test:legacy && pnpm typecheck:legacy

  grader-e2e:
    # One real photo grade through the vendored cardgrading library (Python + OpenCV).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/vendor/cardgrading/requirements.txt

      - name: Install grader (opencv-python-headless, pinned)
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --only-binary=:all: -r apps/api/vendor/cardgrading/requirements.txt
          apps/api/.venv/bin/python -c "import cv2, numpy; print('cv2', cv2.__version__, 'numpy', numpy.__version__)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Real end-to-end photo grade
        run: pnpm --filter @cardflow/api test:grade-e2e
